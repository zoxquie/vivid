name: Build and release

# Releasing = raise the version in src/AppInfo.cs and push to main.
# When main has a version that hasn't been released yet, this builds Vivid.exe and publishes
# release vX.Y.Z with it. Every copy of Vivid picks the new release up by itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: |
          v=$(grep -oP 'public const string Version = "\K[0-9]+\.[0-9]+\.[0-9]+' src/AppInfo.cs)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install .NET Framework reference assemblies (Mono)
        if: steps.v.outputs.new == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-devel xvfb

      - name: Build
        if: steps.v.outputs.new == 'true'
        run: bash build.sh

      - name: Test
        if: steps.v.outputs.new == 'true'
        run: bash tests/run.sh

      - name: Publish the release
        if: steps.v.outputs.new == 'true'
        run: |
          v="${{ steps.v.outputs.version }}"
          gh release create "v$v" bin/Vivid.exe --target "$GITHUB_SHA" --title "Vivid $v" --generate-notes
